<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G-MUNI AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101114;
  color: #f4f4f5;
  font-family: Arial, sans-serif;
}
header {
  padding: 20px;
  border-bottom: 1px solid #292a30;
  font-size: 22px;
  font-weight: bold;
}
header span { color: #8b7cff; }
#chat {
  padding: 18px;
  height: calc(100dvh - 145px);
  overflow-y: auto;
}
.welcome {
  text-align: center;
  margin-top: 22vh;
}
.welcome h1 { font-size: 30px; }
.welcome p { color: #999aa5; }
.message {
  padding: 13px 15px;
  margin: 12px 0;
  border-radius: 15px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.user {
  background: #29253f;
  margin-left: 12%;
}
.ai {
  background: #1c1d22;
  margin-right: 5%;
}
footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  padding: 12px;
  background: #101114;
  border-top: 1px solid #292a30;
  display: flex;
  gap: 8px;
}
input {
  flex: 1;
  min-width: 0;
  background: #202127;
  color: white;
  border: 1px solid #353640;
  border-radius: 13px;
  padding: 14px;
  font-size: 16px;
  outline: none;
}
button {
  background: #8170ff;
  color: white;
  border: none;
  border-radius: 13px;
  padding: 0 18px;
  font-size: 16px;
}
</style>
</head>
<body>
<header><span>G-</span>MUNI <small>AI</small></header>

<main id="chat">
  <div class="welcome" id="welcome">
    <h1>Привет!</h1>
    <p>Я G-MUNI. Чем могу помочь?</p>
  </div>
</main>

<footer>
  <input id="input" placeholder="Напиши сообщение..." />
  <button id="send">➤</button>
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');

function addMessage(text, type) {
  document.getElementById('welcome')?.remove();
  const div = document.createElement('div');
  div.className = 'message ' + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  addMessage(text, 'user');

  const reply = document.createElement('div');
  reply.className = 'message ai';
  reply.textContent = 'Подключение ИИ ещё не настроено.';
  chat.appendChild(reply);
  chat.scrollTop = chat.scrollHeight;
}

document.getElementById('send').addEventListener('click', sendMessage);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
